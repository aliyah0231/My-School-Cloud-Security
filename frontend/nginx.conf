limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;


# =========================================================
# INTERNAL FRONTEND
# Traffic publik sudah melewati:
# HTTPS -> ModSecurity / OWASP CRS -> frontend:80
# =========================================================

server {
    listen 80;
    server_name localhost frontend;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;


    # =====================================================
    # REQUEST LIMIT
    # =====================================================

    client_max_body_size 10m;

    limit_req_status 429;
    limit_conn_status 429;


    # =====================================================
    # SECURITY HEADERS
    # =====================================================

    add_header Strict-Transport-Security
        "max-age=31536000"
        always;

    add_header X-Frame-Options
        "SAMEORIGIN"
        always;

    add_header X-Content-Type-Options
        "nosniff"
        always;

    add_header Referrer-Policy
        "strict-origin-when-cross-origin"
        always;

    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=(), payment=()"
        always;

    add_header Cross-Origin-Opener-Policy
        "same-origin"
        always;

    add_header Cross-Origin-Embedder-Policy
        "require-corp"
        always;

    add_header Cross-Origin-Resource-Policy
        "same-origin"
        always;


    # =====================================================
    # CACHE HARDENING
    # =====================================================

    add_header Cache-Control
        "no-store, no-cache, must-revalidate, private"
        always;

    add_header Pragma
        "no-cache"
        always;


    # =====================================================
    # CONTENT SECURITY POLICY
    # =====================================================

    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
        always;


    # =====================================================
    # ALLOWED HTTP METHODS
    # =====================================================

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }


    # =====================================================
    # BASIC NGINX SQL INJECTION FILTER
    # Layer tambahan selain OWASP CRS
    # =====================================================

    if ($query_string ~* "(union.*select|select.*from|insert.*into|drop.*table|delete.*from)") {
        return 403;
    }


    # =====================================================
    # BASIC NGINX XSS FILTER
    # =====================================================

    if ($query_string ~* "(<script|%3Cscript|javascript:|onerror=|onload=)") {
        return 403;
    }


    # =====================================================
    # BASIC NGINX PATH TRAVERSAL FILTER
    # =====================================================

    if ($query_string ~* "(\.\./|\.\.%2f|%2e%2e)") {
        return 403;
    }


    # =====================================================
    # API -> BACKEND
    # =====================================================

    location /api/ {

        limit_req zone=api_limit burst=20 nodelay;
        limit_conn addr 20;

        proxy_pass http://backend:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP
            $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        # Browser -> WAF menggunakan HTTPS.
        # Frontend -> backend memang HTTP internal.
        # Backend tetap diberi tahu request publik berasal dari HTTPS.
        proxy_set_header X-Forwarded-Proto
            https;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_hide_header X-Powered-By;
    }


    # =====================================================
    # REACT SPA
    # =====================================================

    location / {
        try_files $uri $uri/ /index.html;
    }


    # =====================================================
    # BLOCK SENSITIVE FILES
    # =====================================================

    location ~ /\.(env|git|svn) {
        deny all;
        return 404;
    }

    location ~* \.(bak|sql|log|ini|conf)$ {
        deny all;
        return 404;
    }
}
