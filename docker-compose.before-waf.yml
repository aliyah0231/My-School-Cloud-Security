services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: smk_frontend

    ports:
      - "8080:80"
      - "8443:443"

    depends_on:
      - backend

    networks:
      - public_net


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: smk_backend

    env_file:
      - .env.docker

    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/smk_administrasi"

      # Vault bukan secret.
      VAULT_ADDR: "http://vault:8200"
      VAULT_SECRET_PATH: "secret/data/my-school"

    expose:
      - "4000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./backend/uploads:/app/uploads

    secrets:
      - vault_token

    depends_on:
      postgres:
        condition: service_healthy

      vault-init:
        condition: service_completed_successfully

    networks:
      - public_net
      - private_net


  postgres:
    image: postgres:17-alpine

    container_name: smk_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smk_administrasi

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d smk_administrasi
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

    networks:
      - private_net


  vault:
    image: hashicorp/vault:2.0.4

    container_name: smk_vault

    cap_add:
      - IPC_LOCK

    entrypoint:
      - /bin/sh
      - -c

    command:
      - >
        vault server
        -dev
        -dev-listen-address=0.0.0.0:8200
        -dev-root-token-id="$$(cat /run/secrets/vault_token)"

    secrets:
      - vault_token

    healthcheck:
      test:
        - CMD-SHELL
        - VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1
      interval: 3s
      timeout: 3s
      retries: 20

    networks:
      - private_net


  vault-init:
    image: hashicorp/vault:2.0.4

    container_name: smk_vault_init

    environment:
      VAULT_ADDR: "http://vault:8200"

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        export VAULT_TOKEN="$$(cat /run/secrets/vault_token)"

        echo "Menunggu Vault..."

        until vault status >/dev/null 2>&1
        do
          sleep 2
        done

        echo "Menyimpan secret My-School ke Vault..."

        vault kv put secret/my-school \
          JWT_SECRET="$$(cat /run/secrets/jwt_secret)" \
          COOKIE_SECRET="$$(cat /run/secrets/cookie_secret)" \
          BLOCKCHAIN_PRIVATE_KEY="$$(cat /run/secrets/blockchain_private_key)" \
          DUDI_SIGNER_PRIVATE_KEY="$$(cat /run/secrets/dudi_signer_private_key)" \
          DATA_ENCRYPTION_KEY="$$(cat /run/secrets/data_encryption_key)"

        echo "Vault initialization selesai."

    secrets:
      - vault_token
      - jwt_secret
      - cookie_secret
      - blockchain_private_key
      - dudi_signer_private_key
      - data_encryption_key

    depends_on:
      vault:
        condition: service_healthy

    networks:
      - private_net


networks:

  public_net:
    driver: bridge

  private_net:
    driver: bridge
    internal: true


volumes:

  postgres_data:


secrets:

  vault_token:
    file: ./secrets/vault_token.txt

  jwt_secret:
    file: ./secrets/jwt_secret.txt

  cookie_secret:
    file: ./secrets/cookie_secret.txt

  blockchain_private_key:
    file: ./secrets/blockchain_private_key.txt

  dudi_signer_private_key:
    file: ./secrets/dudi_signer_private_key.txt

  data_encryption_key:
    file: ./secrets/data_encryption_key.txt